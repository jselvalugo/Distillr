[build]
  command   = "npm run build:netlify"
  publish   = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION    = "20"
  # NODE_ENV=production is set on the site, which makes npm skip devDependencies;
  # vite/esbuild are devDependencies and are needed to build.
  NPM_FLAGS       = "--include=dev"
  ALLOW_REMOTE    = "true"
  LOCAL_ONLY_MODE = "false"
  SEED_DEMO_DATA  = "true"

# /api/* is routed to netlify/functions/api.ts via its `config.path`.

# SPA fallback — all other routes serve the React app
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  node_bundler          = "esbuild"
  external_node_modules = ["pg-native"]

[context.production]
  command = "npm run build:netlify"
